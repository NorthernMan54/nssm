name: Build NSSM

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build (${{ matrix.configuration }}|${{ matrix.platform }})
    runs-on: windows-2022
    permissions:
      contents: read
    strategy:
      matrix:
        configuration: [Release, Debug]
        platform: [Win32, x64, ARM64]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: >
          msbuild nssm.sln
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=${{ matrix.platform }}
          /m

      - name: Upload artifact
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: nssm-${{ matrix.platform }}-${{ matrix.configuration }}
          path: |
            out/${{ matrix.configuration }}/**/*.exe
            out/${{ matrix.configuration }}/**/*.pdb
          if-no-files-found: error

          
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on default branch
        run: |
          git fetch origin ${{ github.event.repository.default_branch }}
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/${{ github.event.repository.default_branch }}; then
            echo "Tag ${{ github.ref_name }} is not on the default branch (${{ github.event.repository.default_branch }}). Skipping release."
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
